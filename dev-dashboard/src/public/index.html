<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <h1>🛠 Dev Dashboard</h1>

  <div class="section-header">
    <h2>Docker Compose Services</h2>
    <div class="btn-group">
      <button class="btn btn-start" onclick="dockerAllAction('start')">Start All</button>
      <button class="btn btn-stop" onclick="dockerAllAction('stop')">Stop All</button>
    </div>
  </div>
  <div class="grid" id="docker-grid"></div>

  <div class="section-header">
    <h2>Programs</h2>
    <div class="btn-group">
      <button class="btn btn-start" onclick="programAllAction('start')">Start All</button>
      <button class="btn btn-stop" onclick="programAllAction('stop')">Stop All</button>
    </div>
  </div>
  <div class="grid" id="programs-grid"></div>

  <div id="toast-container"></div>
  <script src="/dashboard.js"></script>
</body>
</html>
