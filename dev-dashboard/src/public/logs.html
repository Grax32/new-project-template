<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs - Dev Dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <nav class="nav">
    <a href="/">← Back to Dashboard</a>
  </nav>

  <div class="log-container">
    <div class="log-header">
      <h1 class="log-title" id="log-title">Logs</h1>
      <div class="log-actions">
        <button class="btn btn-restart" onclick="refreshLogs()">Refresh</button>
        <button class="btn btn-stop" onclick="clearLogs()">Clear</button>
      </div>
    </div>
    <div class="log-box" id="log-content"></div>
  </div>

  <script src="/logs.js"></script>
</body>
</html>
