    hash: '$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W' # password: admin123
    username: 'admin'
    userID: '08a8684b-db88-4b73-90a9-3cd1661f5466'
    groups:
      - 'admins'
      - 'users'

