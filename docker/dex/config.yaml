issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

# OAuth2 clients that can request tokens
oauth2:
  skipApprovalScreen: true

staticClients:
  - id: web-app
    redirectURIs:
      - 'http://localhost:4200/callback'
      - 'http://localhost:4200/auth/callback'
    name: 'Web Application'
    secret: web-app-secret

  - id: api-server
    redirectURIs:
      - 'http://localhost:6314/callback'
      - 'http://localhost:6314/auth/callback'
    name: 'API Server'
    secret: api-server-secret

# Enable the password connector for local development
enablePasswordDB: true

# Static users for development
staticPasswords:
